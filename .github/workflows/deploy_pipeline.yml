name: Airflow & dbt CI/CD

on:
  push:
    branches:
      - main

jobs:
  test_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install Dependencies
        run: |
          pip install apache-airflow==2.7.1 pytest flake8 dbt-postgres

      - name: Lint Python Code
        run: flake8 dags/ --max-line-length=120

      - name: Test Airflow DAG Integrity
        run: pytest tests/test_dag_integrity.py

      - name: Compile dbt Models
        run: dbt compile --project-dir include/dbt_project --profiles-dir include/dbt_project
        # Note: In a real CI environment, you would mock your profiles.yml 
        # so it doesn't require an actual database connection just to compile.

  